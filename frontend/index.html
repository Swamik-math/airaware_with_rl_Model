<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIR-AWARE — Navigate Healthier</title>
    <meta name="description" content="Personalized Health-Aware Route Optimization Platform recommending safe, clean routes based on environmental conditions and individual air-quality sensitivities." />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              vayu: {
                bg: '#071A17',
                surface: '#0D2521',
                card: '#102C27',
                hover: '#153A33',
                border: '#23443B',
                text: '#F1F5EE',
                muted: '#9AAEA5',
                accent: '#B7D96B',
                sec: '#6FBF9A',
                warm: '#E7C873',
                good: '#78C091',
                moderate: '#E3C85A',
                poor: '#E99A5A',
                unhealthy: '#D96B63',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              heading: ['Manrope', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Google Fonts: Manrope & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- MapLibre & Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body class="bg-[#071A17] text-[#F1F5EE] font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
